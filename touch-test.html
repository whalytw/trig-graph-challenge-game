<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三人觸控診斷</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1425;color:#e5edf7;font:18px "Microsoft JhengHei",system-ui,sans-serif}header{padding:18px 24px}h1{font-size:25px;margin:0 0 8px}p{margin:8px 0;line-height:1.6;color:#a8b9cf}.stats{display:flex;gap:14px;flex-wrap:wrap;padding:0 24px 16px}.stats span{padding:12px 18px;background:#1b2b44;border-radius:10px}strong{color:#45d9c5}.pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:calc(100dvh - 265px);min-height:220px;gap:14px;padding:0 20px 20px}.pad{position:relative;border:3px solid var(--color);border-radius:16px;overflow:hidden;background:#111d30;touch-action:none;user-select:none;-webkit-user-select:none}.pad h2{margin:20px;color:var(--color);pointer-events:none}.pad p{margin:20px;pointer-events:none}.contact{position:absolute;width:66px;height:66px;transform:translate(-50%,-50%);border:3px solid var(--color);border-radius:50%;display:grid;place-items:center;background:#1b2b44;font-size:13px;pointer-events:none}a,button{font:inherit;color:#e5edf7;background:#1b2b44;border:1px solid #34465f;border-radius:8px;padding:8px 14px;text-decoration:none;min-height:44px}button{cursor:pointer;touch-action:manipulation}header nav{float:right;display:flex;gap:10px}.hint{font-size:15px}@media(max-height:650px){header{padding:10px 18px}h1{font-size:22px}.hint{display:none}.pads{height:calc(100dvh - 210px)}}
</style></head><body>
<header><nav><a href="index.html">回遊戲</a><button id="reset">清除紀錄</button></nav><h1>三人觸控診斷</h1><p>三位學生各在一區，<strong>同時按住並移動 3 秒</strong>，再分別快速點按。記下 AirSync 與有線連接的結果。</p><p class="hint">若看到 3 個不同 ID，瀏覽器有收到三個獨立接觸點；若同時操作只出現 1 個 mouse，瀏覽器目前只收到單一滑鼠輸入。這項測試不能單獨判定原因。</p></header>
<div class="stats" aria-live="polite"><span>目前接觸點：<strong id="active">0</strong></span><span>最多同時：<strong id="maximum">0</strong></span><span>已收到的類型：<strong id="types">—</strong></span></div>
<main class="pads"><section class="pad" style="--color:#aaa4ff"><h2>左區</h2><p>接觸 <strong class="count">0</strong> 次</p></section><section class="pad" style="--color:#45d9c5"><h2>中區</h2><p>接觸 <strong class="count">0</strong> 次</p></section><section class="pad" style="--color:#ffd080"><h2>右區</h2><p>接觸 <strong class="count">0</strong> 次</p></section></main>
<script>
'use strict';const contacts=new Map(),types=new Set();let maximum=0;
function stats(){document.querySelector('#active').textContent=contacts.size;maximum=Math.max(maximum,contacts.size);document.querySelector('#maximum').textContent=maximum;document.querySelector('#types').textContent=[...types].join('、')||'—';}
for(const pad of document.querySelectorAll('.pad')){
 pad.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();if(contacts.has(e.pointerId))return;types.add(e.pointerType||'未知');const dot=document.createElement('span');dot.className='contact';dot.textContent='ID '+e.pointerId;pad.appendChild(dot);contacts.set(e.pointerId,{pad,dot});pad.querySelector('.count').textContent=Number(pad.querySelector('.count').textContent)+1;try{pad.setPointerCapture(e.pointerId);}catch{}move(e);stats();});
 pad.addEventListener('pointermove',move);
 for(const type of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(type,e=>{const item=contacts.get(e.pointerId);if(!item)return;item.dot.remove();contacts.delete(e.pointerId);stats();});
}
function move(e){const item=contacts.get(e.pointerId);if(!item)return;e.preventDefault();const rect=item.pad.getBoundingClientRect();item.dot.style.left=e.clientX-rect.left+'px';item.dot.style.top=e.clientY-rect.top+'px';}
document.querySelector('#reset').onclick=()=>{maximum=contacts.size;types.clear();for(const pad of document.querySelectorAll('.pad'))pad.querySelector('.count').textContent='0';stats();};
document.addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>
